<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Финальная подборка · Inkbloom Content Bank</title>
<style>
:root{--ink:#24362e;--muted:#7c8275;--paper:#f8f7f0;--line:#dfdfd1;--accent:#d9ed9a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}button,a{font:inherit;touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:999px;background:#fffdf5;color:var(--ink);padding:9px 13px;font-size:12px}button:hover{background:#ebefd9}button.active{background:var(--ink);border-color:var(--ink);color:#f8f7ed}a{color:inherit;text-underline-offset:4px}
header,main,footer{max-width:1560px;margin:auto;padding-left:48px;padding-right:48px}.mast{display:flex;justify-content:space-between;align-items:center;padding:32px 0;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:2px}.logo{display:flex;gap:12px;align-items:center}.logo b{font-family:Georgia,serif;font-size:23px;font-weight:400;letter-spacing:0}.tag{font-size:11px;letter-spacing:1.1px;padding:8px 11px;border:1px solid #c4cab2;border-radius:99px}
.hero{padding:57px 0 37px;display:grid;grid-template-columns:1fr 340px;gap:60px}.eyebrow{font-size:11px;letter-spacing:2.1px;margin-bottom:20px;color:var(--muted)}h1{font-family:Georgia,serif;font-size:clamp(44px,5vw,78px);font-weight:400;line-height:.99;letter-spacing:-2.8px;margin:0 0 25px}.intro{font-size:16px;line-height:1.65;max-width:700px;color:#626c60}.summary{align-self:end;border-left:1px solid var(--line);padding-left:28px;padding-bottom:8px}.summary strong{display:block;font-family:Georgia,serif;font-size:56px;font-weight:400;letter-spacing:-2px}.summary p{font-size:13px;line-height:1.6;color:#6e7668;margin:7px 0}
.toolbar{position:sticky;top:0;z-index:20;background:#f8f7f0f5;backdrop-filter:blur(12px);padding:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}.group{display:flex;gap:5px}.spacer{flex:1}.back{font-size:12px}.copyids{background:var(--accent);border-color:#bed77f}
h2.section{font-family:Georgia,serif;font-size:30px;font-weight:400;letter-spacing:-.6px;margin:42px 0 6px}.sectionnote{font-size:13px;color:#6e7668;margin:0 0 24px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:34px 24px}.card{min-width:0}.cover{position:relative;display:block;overflow:hidden;background:#d9d7cd;border-radius:4px}.cover img{display:block;width:100%;height:100%;object-fit:cover}.id{position:absolute;bottom:12px;left:12px;background:#fffaf0eb;border-radius:3px;padding:5px 8px;font-size:10px;letter-spacing:1px}.rank{position:absolute;top:10px;left:10px;background:#24362eeb;color:#f8f7ed;border-radius:3px;font-size:10px;letter-spacing:1px;padding:5px 8px}.count{position:absolute;bottom:12px;right:12px;background:#15281ceb;color:#fff;border-radius:3px;font-size:10px;padding:5px 8px}
.meta{display:flex;justify-content:space-between;gap:8px;margin-top:13px;font-size:10px;letter-spacing:.7px;color:#78816d}.ad{color:#957333}.card h3{font-family:Georgia,serif;font-size:20px;font-weight:400;line-height:1.23;margin:9px 0 7px;letter-spacing:-.35px}.votes{font-size:12px;color:#5f7a4e}.notes{margin:9px 0 0;padding-left:17px;font-size:12px;line-height:1.55;color:#6d7569}.links{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:11px;font-size:11px;color:#6d7569}.links button{padding:6px 10px;font-size:11px}
.rest{border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:70px 1fr 150px;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5}.row .n{color:#7a8271;font-size:11px;letter-spacing:1px;padding-top:2px}.row ul{margin:4px 0 0;padding-left:17px;color:#6d7569;font-size:12px}.row .v{text-align:right;color:#5f7a4e;font-size:12px}
.empty{padding:70px 0;max-width:680px;font-size:15px;line-height:1.7;color:#5f6a58}.empty a{font-weight:700}
footer{margin-top:60px;padding-top:24px;padding-bottom:50px;border-top:1px solid var(--line);font-size:12px;line-height:1.7;color:#7a8271}footer p{margin:0 0 8px;max-width:900px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#253a2b;color:#fff;border-radius:6px;padding:13px 20px;font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
@media(min-width:1700px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:1100px){header,main,footer{padding-left:28px;padding-right:28px}.hero{grid-template-columns:1fr 250px;gap:30px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:27px 17px}}
@media(max-width:700px){header,main,footer{padding-left:16px;padding-right:16px}.mast{padding:22px 0}.mast>span{font-size:9px;letter-spacing:.8px}.hero{display:block;padding:36px 0 26px}h1{font-size:45px;letter-spacing:-1.8px}.intro{font-size:14px;line-height:1.6}.summary{border-left:0;border-top:1px solid var(--line);margin-top:25px;padding:18px 0 0}.summary strong{font-size:35px;display:inline;margin-right:12px}.summary p{display:inline;font-size:11px}.toolbar{position:static;gap:8px}.toolbar .spacer{flex-basis:100%;height:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:23px 11px}.card h3{font-size:17px}.meta{font-size:9px;letter-spacing:0}.id,.count,.rank{font-size:8px;padding:4px 6px}.row{grid-template-columns:48px 1fr;gap:10px}.row .v{grid-column:2;text-align:left}h2.section{font-size:25px}.tag{font-size:9px;padding:7px}}
</style></head><body>
<header><div class="mast"><div class="logo"><b>Inkbloom</b><span class="tag">CONTENT BANK / FINAL</span></div><span>ФИНАЛЬНАЯ ПОДБОРКА</span></div>
<div class="hero"><div><div class="eyebrow">ИЗ ОТЗЫВОВ КОМАНДЫ · TR / EN</div><h1>Финальная<br>подборка</h1><p class="intro" id="intro"></p></div><aside class="summary" id="summary"></aside></div></header>
<main id="main"></main>
<footer id="foot"></footer><div class="toast" id="toast"></div>
<script src="../data.js"></script><script src="final.js"></script>
<script>
const P=window.PACK.posts,F=window.FINAL,$=s=>document.querySelector(s),byId=Object.fromEntries(P.map(p=>[p.id,p])),pad=n=>String(n).padStart(3,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const styles={tweet:'Twitter style',paper:'Текстовая карточка',photo:'Фото + текст',carousel:'Карусель'},topics={love:'Отношения',news:'Хорошие новости',connection:'Встречи и близкие',opportunity:'Возможности',choice:'Выбор символа',season:'Месяц и новая глава',ritual:'Inkbloom и ритуалы'};
const state={lang:'tr',ratio:'9x16'};let timer;
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.remove('show'),2400)}
async function copy(text,msg){try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove()}toast(msg)}
const votes=id=>(F.votes[id]||{like:0,against:0,notes:[]}),voteText=v=>'♥ '+v.like+(v.against?' · ✕ '+v.against:'');
if(!F){
 $('#intro').textContent='Отзывов команды пока нет. Финальная подборка появится здесь, когда первые отзывы будут собраны.';
 $('#summary').innerHTML='<strong>0</strong><p>отзывов собрано</p>';
 $('#main').innerHTML='<div class="empty">Как оставить отзыв: открой <a href="../">галерею ста черновиков</a>, отметь посты «♥ берём» или «✕ против», при желании напиши комментарий, нажми «Мой отзыв» и перешли текст или файл Максу.</div>';
}else{
 const fin=F.ids.map(id=>byId[id]),slides=fin.reduce((s,p)=>s+p.slides.tr.length,0),car=fin.filter(p=>p.style==='carousel').length,ad=fin.filter(p=>p.ad).length;
 $('#intro').textContent='Собрано '+F.updated.split('-').reverse().join('.')+' из отзывов команды: '+F.reviewers+'. В финал попадают посты, где «берём» больше, чем «против». Это кандидаты: публикация только после отдельного согласования. Ничего не опубликовано.';
 const pl=(n,a,b,c)=>n%10===1&&n%100!==11?a:n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?b:c;
 $('#summary').innerHTML='<strong>'+fin.length+'</strong><p>'+pl(fin.length,'пост','поста','постов')+' в финале · из 100<br>'+(fin.length-car)+' '+pl(fin.length-car,'одиночный','одиночных','одиночных')+' + '+car+' '+pl(car,'карусель','карусели','каруселей')+'<br>'+(fin.length-ad)+' обычных / '+ad+' промо<br>'+slides*4+' JPG · TR / EN · 9:16 и 4:5</p>';
 function render(){
  const r=state.ratio,l=state.lang,ar=r==='9x16'?'9/16':'4/5';
  let h='<div class="toolbar"><div class="group" id="lang"><button data-lang="tr" class="'+(l==='tr'?'active':'')+'">TR</button><button data-lang="en" class="'+(l==='en'?'active':'')+'">EN</button></div><div class="group" id="ratio"><button data-ratio="9x16" class="'+(r==='9x16'?'active':'')+'">9:16</button><button data-ratio="4x5" class="'+(r==='4x5'?'active':'')+'">4:5</button></div><span class="spacer"></span><a class="back" href="../">← Все 100 черновиков</a><button class="copyids" id="copyIds">Скопировать номера</button></div>';
  h+='<h2 class="section">В финале · '+fin.length+'</h2><p class="sectionnote">Порядок: больше голосов «берём» выше. Картинка открывает JPG первого слайда в полном размере.</p>';
  h+=fin.length?'<div class="grid">'+fin.map((p,i)=>{const v=votes(p.id),files=p.files[l][r];return '<article class="card"><a class="cover" style="aspect-ratio:'+ar+'" href="../'+files[0]+'" target="_blank"><img src="../'+p.thumbs[l][r]+'" alt="'+esc(p[l].hook)+'" loading="lazy" width="324" height="'+(r==='9x16'?576:405)+'"><span class="rank">'+(i+1)+'</span><span class="id">№ '+pad(p.id)+'</span>'+(files.length>1?'<span class="count">'+files.length+' СЛАЙДА</span>':'')+'</a><div class="meta"><span>'+styles[p.style]+'</span><span class="'+(p.ad?'ad':'')+'">'+(p.ad?'ПРОМО':topics[p.topic])+'</span></div><h3>'+esc(p.title)+'</h3><div class="votes">'+voteText(v)+'</div>'+(v.notes.length?'<ul class="notes">'+v.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>':'')+'<div class="links"><span>JPG '+l.toUpperCase()+' '+r.replace('x',':')+': '+files.map((f,k)=>'<a href="../'+f+'" target="_blank">'+(k+1)+'</a>').join(' ')+'</span><button data-copy="'+p.id+'">Копировать текст '+l.toUpperCase()+'</button></div></article>'}).join('')+'</div>':'<div class="empty">По текущему правилу в финал пока ничего не прошло.</div>';
  const rest=Object.keys(F.votes).map(Number).filter(id=>!F.ids.includes(id)).sort((a,b)=>(votes(b).like-votes(b).against)-(votes(a).like-votes(a).against)||a-b);
  if(rest.length)h+='<h2 class="section">Не прошли · '+rest.length+'</h2><p class="sectionnote">Голоса и комментарии по остальным постам.</p><div class="rest">'+rest.map(id=>{const p=byId[id],v=votes(id);return '<div class="row"><span class="n">№ '+pad(id)+'</span><div>'+esc(p.title)+(v.notes.length?'<ul>'+v.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>':'')+'</div><span class="v">'+voteText(v)+'</span></div>'}).join('')+'</div>';
  $('#main').innerHTML=h;
 }
 $('#main').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.lang){state.lang=b.dataset.lang;render()}else if(b.dataset.ratio){state.ratio=b.dataset.ratio;render()}else if(b.id==='copyIds')copy(F.ids.join(', '),'Номера скопированы');else if(b.dataset.copy){const c=byId[b.dataset.copy][state.lang];copy(c.hook+'\n\n'+c.body+'\n\n'+c.cta+'\n\n'+c.caption,'Текст скопирован')}});
 render();
 $('#foot').innerHTML='<p>Правило: '+esc(F.rule)+'</p>';
}
$('#foot').innerHTML+='<p>«Сегодня», «завтра» и дни недели считаются от даты публикации. Промо — только анонсы Inkbloom «скоро». Elif — вымышленный редакционный персонаж.</p><p>Inkbloom · Content Bank · финальная подборка. Ничего не опубликовано.</p>';
</script></body></html>
